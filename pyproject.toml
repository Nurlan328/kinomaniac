[project]
name = "kinomaniac"
version = "0.1.0"
description = "Киноманьяк: подбор фильма по сложному запросу только из своего каталога"
requires-python = ">=3.12"
dependencies = [
    "openai==3.41.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
